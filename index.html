<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1e1e2f, #2a2a40);
            --calc-bg: #22252f;
            --display-bg: #181b22;
            --text-color: #ffffff;
            --history-color: #7b7e8d;
            --btn-bg: #2a2d3a;
            --btn-func-bg: #313544;
            --btn-func-color: #4db5ff;
            --btn-op-bg: #3c4258;
            --btn-op-color: #ff9f43;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            --calc-bg: #ffffff;
            --display-bg: #eef2f3;
            --text-color: #333333;
            --history-color: #666666;
            --btn-bg: #f0f0f5;
            --btn-func-bg: #e2e8f0;
            --btn-func-color: #0066cc;
            --btn-op-bg: #e2e8f0;
            --btn-op-color: #d97706;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            transition: background 0.3s ease;
        }

        .theme-toggle {
            margin-bottom: 15px;
            background: var(--calc-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            filter: brightness(1.1);
        }

        .calculator {
            width: 420px;
            background: var(--calc-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .display {
            background: var(--display-bg);
            color: var(--text-color);
            padding: 20px;
            text-align: right;
            word-wrap: break-word;
            word-break: break-all;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .display .history {
            font-size: 0.9rem;
            color: var(--history-color);
            min-height: 20px;
            margin-bottom: 5px;
        }

        .display .current {
            font-size: 2.2rem;
            font-weight: 500;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 15px;
            background: var(--calc-bg);
            transition: background 0.3s ease;
        }

        button {
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            outline: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-color);
            background: var(--btn-bg);
        }

        button:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Color Coding for Buttons */
        .btn-func {
            background: var(--btn-func-bg);
            color: var(--btn-func-color);
            font-size: 0.9rem;
        }

        .btn-op {
            background: var(--btn-op-bg);
            color: var(--btn-op-color);
        }

        .btn-clear {
            background: #ff5252;
            color: #fff;
        }

        .btn-delete {
            background: #ff793f;
            color: #fff;
        }

        .btn-eq {
            background: #2ed573;
            color: #fff;
            grid-column: span 2;
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Theme Switcher Button -->
    <button class="theme-toggle" onclick="toggleTheme()">☀️ Light Mode</button>

    <div class="calculator">
        <!-- Display Area -->
        <div class="display">
            <div id="history" class="history"></div>
            <div id="current" class="current">0</div>
        </div>

        <!-- Keypad Area -->
        <div class="buttons">
            <!-- Row 1: Scientific Functions -->
            <button class="btn-func" onclick="appendFunction('sin')">sin</button>
            <button class="btn-func" onclick="appendFunction('cos')">cos</button>
            <button class="btn-func" onclick="appendFunction('tan')">tan</button>
            <button class="btn-func" onclick="appendValue('(')">(</button>
            <button class="btn-func" onclick="appendValue(')')">)</button>

            <!-- Row 2: Scientific Functions -->
            <button class="btn-func" onclick="appendFunction('log')">log</button>
            <button class="btn-func" onclick="appendFunction('ln')">ln</button>
            <button class="btn-func" onclick="appendFunction('sqrt')">√</button>
            <button class="btn-func" onclick="appendValue('^')">x^y</button>
            <button class="btn-func" onclick="appendConstant('pi')">π</button>

            <!-- Row 3: Clear, Delete, Operators -->
            <button class="btn-clear" onclick="clearDisplay()">AC</button>
            <button class="btn-delete" onclick="deleteLast()">DEL</button>
            <button class="btn-func" onclick="appendConstant('e')">e</button>
            <button class="btn-op" onclick="appendValue('/')">/</button>
            <button class="btn-op" onclick="appendValue('*')">×</button>

            <!-- Row 4: Numbers & Operators -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="btn-op" onclick="appendValue('-')">-</button>
            <button class="btn-func" onclick="appendFunction('factorial')">n!</button>

            <!-- Row 5: Numbers & Operators -->
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="btn-op" onclick="appendValue('+')">+</button>
            <button class="btn-func" onclick="appendValue('%')">%</button>

            <!-- Row 6: Numbers & Equals -->
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            
            <!-- Row 7: Decimal & Equals -->
            <button onclick="appendValue('.')">.</button>
            <button class="btn-eq" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const currentDisplay = document.getElementById('current');
        const historyDisplay = document.getElementById('history');
        let currentInput = '0';
        let historyExpression = '';

        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.querySelector('.theme-toggle');
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️ Light Mode';
            }
        }

        function updateDisplay() {
            currentDisplay.textContent = currentInput;
            historyDisplay.textContent = historyExpression;
        }

        function appendValue(value) {
            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            updateDisplay();
        }

        function appendFunction(func) {
            if (currentInput === '0') {
                currentInput = func + '(';
            } else {
                currentInput += func + '(';
            }
            updateDisplay();
        }

        function appendConstant(constant) {
            if (currentInput === '0') {
                currentInput = constant === 'pi' ? 'Math.PI' : 'Math.E';
            } else {
                currentInput += constant === 'pi' ? 'Math.PI' : 'Math.E';
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            historyExpression = '';
            updateDisplay();
        }

        function deleteLast() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = '0';
            }
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0) return NaN;
            if (n === 0 || n === 1) return 1;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function calculate() {
            try {
                historyExpression = currentInput;
                
                let expression = currentInput
                    .replace(/sin\(/g, 'Math.sin(Math.PI/180 * ')
                    .replace(/cos\(/g, 'Math.cos(Math.PI/180 * ')
                    .replace(/tan\(/g, 'Math.tan(Math.PI/180 * ')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/sqrt\(/g, 'Math.sqrt(')
                    .replace(/factorial\(/g, 'factorial(')
                    .replace(/\^/g, '**');

                let result = eval(expression);
                
                currentInput = parseFloat(result.toFixed(10)).toString();
                historyExpression += ' =';
                updateDisplay();
            } catch (error) {
                currentInput = 'Error';
                updateDisplay();
                setTimeout(() => {
                    currentInput = '0';
                    updateDisplay();
                }, 1500);
            }
        }
    </script>
</body>
</html>
